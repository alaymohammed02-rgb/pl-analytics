<style>
/* Layout: a working bench. The viewport is the stage; one tabbed panel holds objects, properties, scene and save. Single column on a phone. */
:root{
  --bg:#12151a; --panel:#1a1e25; --panel2:#222831; --line:#2e3540; --fg:#e8ebf0; --mute:#97a1b0;
  --accent:#e9b44c; --accent-ink:#1a1405; --danger:#e5684f; --stage:#0d1014;
  --f-display:'Changa','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f2f4f7; --line:#d3d9e1; --fg:#1a1e25; --mute:#566174;
  --accent:#a8680a; --accent-ink:#ffffff; --danger:#c0432c; --stage:#e4e8ee; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f2f4f7; --line:#d3d9e1; --fg:#1a1e25; --mute:#566174;
  --accent:#a8680a; --accent-ink:#ffffff; --danger:#c0432c; --stage:#e4e8ee; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);
  padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:.2px}
h1 small{font:400 12px var(--f-body);color:var(--mute);margin-inline-start:10px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-height:36px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"],button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.4;cursor:default}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar .sep{width:1px;align-self:stretch;background:var(--line);margin-inline:4px}
.bar .lbl{color:var(--mute);font-size:12px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.stage{position:relative;height:clamp(320px,64dvh,740px);background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .tip{position:absolute;inset-inline:10px;bottom:8px;color:var(--mute);font-size:12px;pointer-events:none;text-shadow:0 1px 2px var(--stage)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;display:grid;grid-template-rows:auto 1fr;max-height:calc(64dvh + 52px)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:12px 12px 0 0;background:none;min-height:44px;color:var(--mute)}
.tabs button[aria-selected="true"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
.pane{padding:12px;overflow:auto;min-height:0}
.pane[hidden]{display:none}
.list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid transparent;border-radius:8px;cursor:pointer;min-height:38px}
.item:hover{background:var(--panel2)}
.item.sel{border-color:var(--accent);background:var(--panel2)}
.item .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{min-height:28px;padding:2px 8px}
.empty{color:var(--mute);padding:8px}
.grid2{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.grid2 .k{color:var(--mute);font-size:12px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f>label,.f>.k{color:var(--mute);font-size:12px}
input[type=text],input[type=number],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px;font-family:var(--f-mono)}
input[type=text]{font-family:var(--f-body)}
input[type=number]{text-align:center;padding-inline:4px}
select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
.stage.drop{outline:2px dashed var(--accent);outline-offset:-6px}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{min-height:150px;font-size:12px;resize:vertical;direction:ltr}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{color:var(--mute);font-size:12px;min-height:18px}
.shot{max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:8px}
h2{font:700 15px var(--f-display);margin:0 0 8px}
.hint{color:var(--mute);font-size:12px;margin:6px 0 0}
.left{display:grid;gap:10px;min-width:0}
.tl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;min-width:0}
.tl .row{gap:6px}
.tl input[type=range]{flex:1;min-width:120px}
.tl input[type=number]{width:70px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
#t-time{direction:ltr}
.tlbar{position:relative;height:28px;background:var(--panel2);border-radius:8px;direction:ltr;overflow:hidden}
.tlbar .head{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.7;pointer-events:none}
.kf{position:absolute;top:50%;width:14px;height:14px;min-height:0;padding:0;transform:translate(-50%,-50%) rotate(45deg);background:var(--accent);border:1px solid var(--bg);border-radius:2px}
.kf.cur{outline:2px solid var(--fg)}
@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .panel{max-height:none;min-height:360px}
  .stage{height:clamp(300px,52dvh,520px)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header>
    <h1>Mujassam Studio<small data-i18n="sub"></small></h1>
    <div class="bar"><button id="lang" type="button"></button></div>
  </header>

  <div class="bar" id="addbar" role="toolbar" aria-label="add"></div>
  <div class="bar" id="toolbar" role="toolbar" aria-label="tools"></div>
  <p class="msg" id="status" role="status"></p>

  <div class="app">
    <div class="left">
    <input type="file" id="imgIn" accept="image/*" multiple hidden>
    <input type="file" id="mdlIn" multiple hidden>
    <div class="stage" id="stage"><div class="tip" data-i18n="tip"></div></div>
    <div class="tl" id="tl" aria-label="timeline">
      <div class="row">
        <button type="button" id="t-play" data-i18n="play"></button>
        <button type="button" id="t-stop" data-i18n="stopT"></button>
        <input type="range" id="t-time" min="0" max="4" step="0.01" value="0" aria-label="time">
        <span class="mono" id="t-lbl">0.00 / 4.00</span>
      </div>
      <div class="tlbar" id="t-track"><span class="head" id="t-head"></span></div>
      <div class="row">
        <button type="button" id="t-key" data-i18n="keyAdd"></button>
        <button type="button" id="t-keydel" data-i18n="keyDel"></button>
        <select id="t-ease" aria-label="ease" style="width:auto"><option value="ease" data-i18n="easeSmooth"></option><option value="lin" data-i18n="easeLin"></option></select>
        <span class="lbl" data-i18n="dur" style="color:var(--mute);font-size:12px"></span><input type="number" id="t-dur" min="0.5" max="60" step="0.5" value="4" aria-label="duration">
        <button type="button" id="t-loop" aria-pressed="true" data-i18n="loop"></button>
        <button type="button" id="t-auto" aria-pressed="false" data-i18n="auto"></button>
      </div>
      <p class="hint" data-i18n="tlHint"></p>
    </div>
    </div>
    <section class="panel" aria-label="panel">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="pane" id="p-obj" role="tabpanel"><ul class="list" id="list"></ul></div>
      <div class="pane" id="p-prop" role="tabpanel" hidden>
        <div id="noSel" class="empty" data-i18n="noSel"></div>
        <div id="props" hidden>
          <div class="f"><label for="i-name" data-i18n="name"></label><input type="text" id="i-name"></div>
          <div class="f"><span class="k" data-i18n="pos"></span><div class="grid2" style="grid-template-columns:repeat(3,minmax(0,1fr))"><input type="number" step="0.05" id="px"><input type="number" step="0.05" id="py"><input type="number" step="0.05" id="pz"></div></div>
          <div class="f"><span class="k" data-i18n="rot"></span><div class="grid2" style="grid-template-columns:repeat(3,minmax(0,1fr))"><input type="number" step="5" id="rx"><input type="number" step="5" id="ry"><input type="number" step="5" id="rz"></div></div>
          <div class="f"><span class="k" data-i18n="scl"></span><div class="grid2" style="grid-template-columns:repeat(3,minmax(0,1fr))"><input type="number" step="0.05" min="0.05" id="sx"><input type="number" step="0.05" min="0.05" id="sy"><input type="number" step="0.05" min="0.05" id="sz"></div></div>
          <div class="f"><label for="i-color" data-i18n="color"></label><input type="color" id="i-color"></div>
          <div class="f"><label for="i-metal" data-i18n="metal"></label><input type="range" id="i-metal" min="0" max="1" step="0.01"></div>
          <div class="f"><label for="i-rough" data-i18n="rough"></label><input type="range" id="i-rough" min="0" max="1" step="0.01"></div>
          <div class="f"><label for="i-op" data-i18n="opacity"></label><input type="range" id="i-op" min="0.1" max="1" step="0.01"></div>
          <div class="row"><button type="button" id="b-wire" aria-pressed="false" data-i18n="wire"></button></div>
          <p class="hint" id="modelInfo" hidden></p>
          <div id="imgProps" hidden style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
            <h2 data-i18n="imgTitle"></h2>
            <div class="f"><label for="im-mode" data-i18n="imgMode"></label><select id="im-mode"><option value="flat" data-i18n="mFlat"></option><option value="relief" data-i18n="mRelief"></option><option value="solid" data-i18n="mSolid"></option></select></div>
            <div class="f"><label for="im-depth" data-i18n="imgDepth"></label><input type="range" id="im-depth" min="0.02" max="1.5" step="0.01"></div>
            <div class="f"><label for="im-thr" data-i18n="imgThr"></label><input type="range" id="im-thr" min="0.05" max="0.95" step="0.01"></div>
            <div class="row"><button type="button" id="im-inv" aria-pressed="false" data-i18n="imgInv"></button></div>
            <p class="hint" data-i18n="imgHint"></p>
          </div>
        </div>
      </div>
      <div class="pane" id="p-scene" role="tabpanel" hidden>
        <div class="f"><label for="s-bg" data-i18n="bg"></label><input type="color" id="s-bg"></div>
        <div class="f"><label for="s-amb" data-i18n="ambient"></label><input type="range" id="s-amb" min="0" max="2" step="0.05"></div>
        <div class="f"><label for="s-sun" data-i18n="sun"></label><input type="range" id="s-sun" min="0" max="3" step="0.05"></div>
        <div class="row"><button type="button" id="b-grid" aria-pressed="true" data-i18n="grid"></button><button type="button" id="b-shadow" aria-pressed="true" data-i18n="shadows"></button></div>
        <div class="row" style="margin-top:12px"><button type="button" id="b-reset" data-i18n="resetCam"></button><button type="button" id="b-new" class="danger" data-i18n="newScene"></button></div>
        <p class="msg" id="m-new"></p>
      </div>
      <div class="pane" id="p-save" role="tabpanel" hidden>
        <h2 data-i18n="picture"></h2>
        <div class="row"><button type="button" id="b-shot" data-i18n="capture"></button></div>
        <p class="hint" data-i18n="shotHint"></p>
        <div id="shotBox"></div>
        <h2 style="margin-top:18px" data-i18n="json"></h2>
        <textarea id="json" spellcheck="false" aria-label="json"></textarea>
        <div class="row" style="margin-top:8px"><button type="button" id="b-copy" data-i18n="copy"></button><button type="button" id="b-apply" data-i18n="apply"></button></div>
        <p class="msg" id="m-json"></p>
        <p class="hint" data-i18n="autosave"></p>
      </div>
    </section>
  </div>
</div>

const A={t:0,dur:4,loop:true,playing:false,auto:false,last:0};
const r2=x=>+x.toFixed(2),r4=x=>+x.toFixed(4);
const L3=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];
function poseAt(ks,t){
  const hold=k=>({p:k.p,q:k.q,s:k.s,c0:k.c,c1:k.c,u:0,o:k.o});
  if(t<=ks[0].t)return hold(ks[0]);const last=ks[ks.length-1];if(t>=last.t)return hold(last);
  let i=0;while(ks[i+1].t<t)i++;const a=ks[i],b=ks[i+1];let u=(t-a.t)/(b.t-a.t);if(a.e!=='lin')u=u*u*(3-2*u);
  return {p:L3(a.p,b.p,u),q:L3(a.q,b.q,u),s:L3(a.s,b.s,u),c0:a.c,c1:b.c,u,o:a.o+(b.o-a.o)*u};
}
const cA=new THREE.Color(),cB=new THREE.Color();
function applyAt(t){
  objs.forEach(m=>{
    const ks=m.userData.keys;if(!ks||!ks.length)return;const P=poseAt(ks,t);
    m.position.set(P.p[0],P.p[1],P.p[2]);m.rotation.set(P.q[0]*D2R,P.q[1]*D2R,P.q[2]*D2R);m.scale.set(P.s[0],P.s[1],P.s[2]);
    if(ks.some(k=>k.c!==ks[0].c)){cA.set(P.c0);cB.set(P.c1);cA.lerp(cB,P.u);eachMat(m,mt=>{if(mt.color)mt.color.copy(cA)})}
    if(ks.some(k=>k.o!==ks[0].o)){eachMat(m,mt=>{mt.opacity=P.o;mt.transparent=P.o<1})}
  });
}
function addKey(m){
  const q=m.rotation,k={t:r2(A.t),p:m.position.toArray().map(r4),q:[q.x/D2R,q.y/D2R,q.z/D2R].map(r2),s:m.scale.toArray().map(r4),c:'#'+m.material.color.getHexString(),o:r2(m.material.opacity),e:$('#t-ease').value};
  const ks=m.userData.keys||(m.userData.keys=[]);const i=ks.findIndex(x=>Math.abs(x.t-k.t)<.02);

}
